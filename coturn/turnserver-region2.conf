# ----------------------------------------------------------------------
# Coturn Server Configuration - Region 2 Staging (T-36)
# ----------------------------------------------------------------------

listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

realm=staging-turn-r2.yourdomain.com
server-name=staging-turn-r2.yourdomain.com

use-auth-secret
static-auth-secret=super_secret_staging_turn_key_2026_very_long_entropy
lt-cred-mech

stale-nonce=600

min-port=49152
max-port=49300

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

fingerprint
no-cli
no-tcp-relay
verbose
no-multicast-peers