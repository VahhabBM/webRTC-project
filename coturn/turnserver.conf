# ----------------------------------------------------------------------
# Coturn Server Configuration - Region 1 Staging (T-35)
# ----------------------------------------------------------------------

# پورت‌های استاندارد شنود
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# آی‌پی و دامنه رلم (Realm)
realm=staging-turn.yourdomain.com
server-name=staging-turn.yourdomain.com

# فعال‌سازی مکانیسم احراز هویت REST API با سکرت مشترک (مطابق T-28)
use-auth-secret
static-auth-secret=super_secret_staging_turn_key_2026_very_long_entropy
lt-cred-mech

# بازه زمانی معتبر بودن Nonce (بر حسب ثانیه)
stale-nonce=600

# بازه پورت‌های مجاز برای رله ترافیک مدیا (UDP Relay Range)
min-port=49152
max-port=49300

# گواهی‌نامه‌های معتبر SSL/TLS (Let's Encrypt یا گواهی سازمان)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# تنظیمات بهینه‌سازی و امنیت
fingerprint
no-cli
no-tcp-relay
verbose
no-multicast-peers