<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #f4f5f7;
      font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
      direction: rtl;
      text-align: right;
      color: #172b4d;
      line-height: 1.8;
    }
    .email-card {
      max-width: 580px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 32px 24px;
      border: 1px solid #ebecf0;
    }
    .header {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 2px solid #0052cc;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 20px;
      color: #0052cc;
      margin: 0;
    }
    .btn-action {
      display: inline-block;
      padding: 12px 28px;
      background-color: #0052cc;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      margin: 20px 0;
    }
    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #ebecf0;
      font-size: 12px;
      color: #6b778c;
      text-align: center;
    }
    .raw-link {
      word-break: break-all;
      direction: ltr;
      text-align: left;
      font-size: 12px;
      color: #0052cc;
      background: #f4f5f7;
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="email-card">
    <div class="header">
      <h1>سامانه همسان‌گزینی رویداد</h1>
    </div>
    {% block content %}{% endblock %}
    <div class="footer">
      <p>این پیام به صورت سیستمی ارسال شده است؛ لطفاً به آن پاسخ ندهید.</p>
    </div>
  </div>
</body>
</html>
