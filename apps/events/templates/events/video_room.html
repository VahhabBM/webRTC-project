<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Call Room</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font: 15px/1.5 system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem 2rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      background: var(--surface);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
      background: #475569;
      text-transform: uppercase;
    }
    .badge.connected, .badge[data-phase="in_round"] { background: var(--success); }
    .badge.degraded { background: var(--warning); }
    .badge.failed, .badge[data-phase="disconnected"] { background: var(--danger); }
    .badge[data-phase="preconnecting"] { background: var(--accent); }
    .badge[data-phase="round_ending"] { background: #7c3aed; }
    .badge[data-phase="event_ended"] { background: #64748b; }

    .timer-block {
      margin-left: auto;
      text-align: right;
    }
    .timer-block[data-state="waiting"] .timer-value { color: var(--muted); }
    .timer-block[data-state="normal"] .timer-value { color: var(--text); }
    .timer-block[data-state="warning"] .timer-value { color: var(--warning); animation: pulse 1s ease-in-out infinite; }
    .timer-block[data-state="expired"] .timer-value { color: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.65; } }
    .timer-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .timer-value { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }

    .partner-card {
      background: var(--surface);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .partner-card h2 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    .partner-tags { color: var(--muted); font-size: 0.9rem; margin: 0; }
    .meta-row { display: flex; gap: 1.5rem; margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted); }

    .videos { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .videos { grid-template-columns: 1fr; } }
    .video-card {
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
      padding: 0.5rem;
      text-align: center;
    }
    .video-card h3 { margin: 0.25rem 0 0.5rem; font-size: 0.9rem; color: var(--muted); }
    video {
      width: 100%;
      height: auto;
      max-height: 320px;
      background: #000;
      border-radius: 8px;
      transform: scaleX(-1);
    }
    #remoteVideo { transform: none; }

    .status-footer {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    .event-ended-banner {
      display: none;
      background: #334155;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .event-ended-banner.visible { display: block; }
  </style>
</head>
<body>

  <h1>Call Room</h1>

  <div id="eventEndedBanner" class="event-ended-banner">
    <strong>Event ended.</strong> Thank you for participating.
  </div>

  <div class="top-bar">
    <span id="phaseBadge" class="badge" data-phase="idle">CONNECTING</span>
    <span>Connection: <span id="connectionBadge" class="badge">—</span></span>
    <div id="timerContainer" class="timer-block" data-state="waiting">
      <div class="timer-label">Time remaining</div>
      <div id="timerDisplay" class="timer-value">--:--</div>
    </div>
  </div>

  <div class="partner-card">
    <h2 id="partnerName">—</h2>
    <p id="partnerTags" class="partner-tags" hidden></p>
    <div class="meta-row">
      <span id="roundLabel">—</span>
      <span>Room: <span id="roomLabel">—</span></span>
    </div>
  </div>

  <div class="videos">
    <div class="video-card">
      <h3>You</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-card">
      <h3>Partner</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <p id="statusFooter" class="status-footer">Connecting…</p>

  <script type="module">
    import { CallRoomController, CallRoomPhase } from '/static/events/js/call_room.js';

    const WARNING_THRESHOLD_SECONDS = {{ warning_threshold_seconds }};

    const controller = new CallRoomController({
      myParticipantId: null,
      warningThresholdSeconds: WARNING_THRESHOLD_SECONDS,
      elements: {
        localVideo: document.getElementById('localVideo'),
        remoteVideo: document.getElementById('remoteVideo'),
        timerDisplay: document.getElementById('timerDisplay'),
        timerContainer: document.getElementById('timerContainer'),
        partnerName: document.getElementById('partnerName'),
        partnerTags: document.getElementById('partnerTags'),
        roundLabel: document.getElementById('roundLabel'),
        roomLabel: document.getElementById('roomLabel'),
        phaseBadge: document.getElementById('phaseBadge'),
        connectionBadge: document.getElementById('connectionBadge'),
      },
      fetchIceServers: async () => {
        const res = await fetch('/api/ice-servers/');
        if (!res.ok) throw new Error('ICE servers unavailable');
        return res.json();
      },
      onPhaseChange: (phase) => {
        const footer = document.getElementById('statusFooter');
        const banner = document.getElementById('eventEndedBanner');
        if (phase === CallRoomPhase.EVENT_ENDED) {
          banner.classList.add('visible');
          footer.textContent = 'Event has ended.';
        } else if (phase === CallRoomPhase.DISCONNECTED) {
          footer.textContent = 'Connection lost — reconnecting…';
        } else if (phase === CallRoomPhase.PRECONNECTING) {
          footer.textContent = 'Preparing next round…';
        } else if (phase === CallRoomPhase.IN_ROUND) {
          footer.textContent = 'Round in progress';
        } else if (phase === CallRoomPhase.ROUND_ENDING) {
          footer.textContent = 'Round ended — waiting for next pairing…';
        } else {
          footer.textContent = 'Waiting for pairing…';
        }
      },
    });

    async function init() {
      const meRes = await fetch('/participant/me/');
      if (!meRes.ok) {
        document.getElementById('statusFooter').textContent =
          'Not authenticated. Please join with a valid token first.';
        return;
      }
      const meData = await meRes.json();
      controller.myParticipantId = meData.participant.id;
      controller.connect();
    }

    init();
  </script>
</body>
</html>
